name: Release Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check app.js
      - name: Release audit
        run: node scripts/release-audit.mjs
      - name: Rebuild and require clean generated output
        run: |
          node build.mjs
          git diff --exit-code -- app.js styles.css index.html
