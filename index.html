<style>html,body{height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<title>The Daily Alchemist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one phone column. Velvet night ground, parchment "archive pages" for ritual work, raised gold foil for anything sacred. */
:root{
  color-scheme: dark;
  --night:#16132A;        /* velvet midnight plum */
  --night-2:#211C3B;
  --night-3:#2C2650;
  --line:rgba(231,196,90,.28);
  --glow:#F4F1E6;         /* Lunar Glow */
  --glow-dim:#D8D1E6;
  --glow-faint:#ADA5C4;
  --fuchsia:#BF1E73;      /* Cosmic Fuchsia */
  --fuchsia-hi:#E0438F;
  --flame:#E4572E;        /* Solar Flame */
  --teal:#3A8484;         /* Sunset Teal */
  --petal:#EBB7D0;        /* Petal Dust */
  --ember:#583A20;        /* Forest Ember */
  --gold:#E7C45A;
  --gold-deep:#9A7414;
  --parch:#F3EAD3;
  --parch-2:#E8DBBC;
  --ink:#2A2130;
  --ink-soft:#5B4B5E;
  --foil:linear-gradient(100deg,#8A6512 0%,#E9C861 22%,#FFF1B8 38%,#C99B26 55%,#F4D778 74%,#8A6512 100%);
  --f-display:"Lora","Iowan Old Style",Georgia,serif;
  --f-sc:"Lora",Georgia,serif;
  --f-book:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-ui:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--glow);font-family:var(--f-book);font-size:20.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
   radial-gradient(1200px 500px at 110% -10%,rgba(191,30,115,.22),transparent 60%),
   radial-gradient(900px 520px at -20% 30%,rgba(58,132,132,.16),transparent 60%);}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;padding:0 18px calc(96px + env(safe-area-inset-bottom,0px))}
.foil{background:var(--foil);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-reduced-motion:no-preference){.foil.shine{animation:shine 9s ease-in-out infinite}}
@keyframes shine{0%,100%{background-position:0% 0}50%{background-position:100% 0}}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:18px 8px}
.top .brand{flex:1;min-width:0}
.brand .eyebrow{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--glow-faint)}
.brand h1{margin:0;font-family:var(--f-sc);font-weight:400;font-size:28.5px;line-height:1.05;letter-spacing:.01em}
.seal-btn{border:0;background:none;padding:0;width:52px;height:52px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.seal-btn canvas{width:52px;height:52px;display:block}

/* sky strip */
.sky{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px 0 18px;border-bottom:1px solid var(--line)}
.sky svg{width:58px;height:58px}
.sky .phase{font-family:var(--f-display);font-size:24px;line-height:1.1}
.sky .meta{font-family:var(--f-ui);font-size:15.5px;color:var(--glow-dim);letter-spacing:.02em;margin-top:3px}
.sky .meta b{font-weight:700;color:var(--glow)}

section.view{padding-top:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
section.view>*{min-width:0}
.label{font-family:var(--f-ui);font-size:15.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h2{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:25.5px;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--glow-dim)}
.small{font-family:var(--f-ui);font-size:16px}

/* Aura intake */
.aura{position:relative;padding:20px 18px 18px;border-radius:18px;background:linear-gradient(180deg,rgba(44,38,80,.92),rgba(33,28,59,.92));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,241,184,.12),0 18px 40px -20px rgba(0,0,0,.7)}
.aura .speaker{display:flex;align-items:center;gap:10px}
.aura .speaker svg{width:30px;height:30px;flex:none}
.aura .speaker .who{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--glow-dim)}
.aura .q{font-family:var(--f-display);font-size:30.5px;line-height:1.12;margin:12px 0 12px}
textarea{width:100%;min-height:108px;resize:vertical;border-radius:12px;border:1px solid rgba(231,196,90,.35);background:rgba(22,19,42,.7);padding:12px 14px;font-family:var(--f-book);font-size:20.5px;line-height:1.45;color:var(--glow)}
textarea::placeholder{color:var(--glow-faint);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(244,241,230,.18);background:rgba(244,241,230,.04);border-radius:999px;padding:7px 13px;font-family:var(--f-ui);font-size:16px;color:var(--glow-dim);transition:all .15s}
.chip:hover{border-color:var(--gold);color:var(--glow)}
.chip[aria-pressed="true"]{background:rgba(231,196,90,.14);border-color:var(--gold);color:var(--glow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.timechips .chip{padding:6px 11px}
.btn{border:0;border-radius:999px;padding:13px 20px;font-family:var(--f-ui);font-weight:700;font-size:18.5px;letter-spacing:.03em;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-main{background:radial-gradient(120% 140% at 30% 0%,var(--fuchsia-hi),var(--fuchsia) 55%,#8E1054);color:#FFF6FA;box-shadow:inset 0 0 0 1px rgba(255,220,120,.55),inset 0 2px 0 rgba(255,255,255,.18),0 10px 22px -10px rgba(191,30,115,.8)}
.btn-main:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--glow);box-shadow:inset 0 0 0 1px rgba(231,196,90,.5)}
.btn-ghost:hover{background:rgba(231,196,90,.08)}
.btn-ink{background:var(--ink);color:var(--parch)}
.btn[disabled]{opacity:.5;cursor:default}
.full{width:100%}

/* guardian reading */
.reading{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--night-2)}
.reading .head{display:flex;gap:12px;align-items:center;padding:16px 18px 0}
.reading .head svg{width:44px;height:44px;flex:none}
.reading .who{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase}
.reading .name{font-family:var(--f-display);font-size:27.5px;line-height:1}
.reading .body{padding:12px 18px 16px;display:grid;gap:12px}
.reading .voice{font-family:var(--f-display);font-style:italic;font-size:23px;line-height:1.35}
.why{font-family:var(--f-ui);font-size:16.5px;line-height:1.5;color:var(--glow-dim);border-left:2px solid var(--gold);padding-left:10px}
.why b{color:var(--glow);font-weight:700}
.care{background:rgba(235,183,208,.1);border:1px solid rgba(235,183,208,.4);border-radius:12px;padding:12px 14px;font-family:var(--f-ui);font-size:17px}
.thinking{display:flex;align-items:center;gap:12px;padding:18px;font-family:var(--f-display);font-style:italic;font-size:23.5px;color:var(--glow-dim)}
.thinking .orb{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px 4px rgba(231,196,90,.55)}
@media (prefers-reduced-motion:no-preference){.thinking .orb{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}

/* parchment ritual card */
.page{position:relative;background:linear-gradient(180deg,var(--parch),var(--parch-2));color:var(--ink);border-radius:6px;padding:18px 18px 16px;box-shadow:0 14px 30px -16px rgba(0,0,0,.8)}
.page::before{content:"";position:absolute;inset:6px;border:1px solid rgba(154,116,20,.55);border-radius:3px;pointer-events:none;box-shadow:inset 0 0 0 3px var(--parch),inset 0 0 0 4px rgba(154,116,20,.35)}
.page .kicker{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.page h3{color:var(--ink);font-size:28.5px;margin-top:4px}
.page .facts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 10px;font-family:var(--f-ui);font-size:15.5px;color:var(--ink-soft)}
.page .needs{font-size:19px;line-height:1.45}
.page .needs b{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:2px}
.page .adj{font-family:var(--f-ui);font-size:15.5px;color:#7A3B12;margin-top:8px}
.page .actions{display:flex;gap:10px;margin-top:14px;position:relative}

/* cards generic */
.card{border-radius:16px;border:1px solid rgba(244,241,230,.1);background:rgba(33,28,59,.7);padding:16px}
.card.link{display:block;width:100%;text-align:left;color:inherit}
.card.link:hover{border-color:var(--line)}

/* altar draw */
.altar{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}
.tarot{perspective:900px;width:112px;height:168px;border:0;background:none;padding:0}
.tarot .inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.tarot.flipped .inner{transform:rotateY(180deg)}
.tarot .face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.tarot .back{background:radial-gradient(circle at 50% 42%,#3A2B6B,#1B1535 70%);box-shadow:inset 0 0 0 1px rgba(231,196,90,.7),inset 0 0 0 5px #1B1535,inset 0 0 0 6px rgba(231,196,90,.45)}
.tarot .back svg{width:100%;height:100%}
.tarot .front{transform:rotateY(180deg);background:linear-gradient(180deg,var(--parch),var(--parch-2));color:var(--ink);display:grid;place-items:center;text-align:center;padding:10px;box-shadow:inset 0 0 0 1px rgba(154,116,20,.8),inset 0 0 0 5px var(--parch),inset 0 0 0 6px rgba(154,116,20,.4)}
.tarot .front svg{width:46px;height:46px}
.tarot .front .n{font-family:var(--f-sc);font-size:19.5px}
@media (prefers-reduced-motion:reduce){.tarot .inner{transition:none}}

/* resurface */
.memory blockquote{margin:8px 0 0;font-family:var(--f-display);font-style:italic;font-size:23.5px;line-height:1.35;color:var(--glow)}

/* journey */
.days{display:grid;gap:8px}
.day{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid rgba(244,241,230,.1);background:rgba(33,28,59,.6);border-radius:14px;padding:10px 12px;color:inherit}
.day .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-sc);font-size:22.5px;box-shadow:inset 0 0 0 1px var(--line)}
.day.done .num{background:rgba(231,196,90,.16);color:var(--gold)}
.day.next{border-color:var(--gold);background:rgba(44,38,80,.9)}
.day[disabled]{opacity:.45;cursor:default}
.day .t{font-family:var(--f-display);font-size:23.5px;line-height:1.1}
.day .s{font-family:var(--f-ui);font-size:15.5px;color:var(--glow-dim);margin-top:2px}
.day .st{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--glow-faint)}
.progress{height:4px;border-radius:4px;background:rgba(244,241,230,.1);overflow:hidden}
.progress i{display:block;height:100%;background:var(--foil)}
.price{font-family:var(--f-ui);font-size:16px;font-weight:700;color:var(--gold);white-space:nowrap}
.offer{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.offer .d{grid-column:1/-1;font-size:19px;color:var(--glow-dim)}

/* circle */
.circle{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g{border:1px solid rgba(244,241,230,.1);background:rgba(33,28,59,.6);border-radius:14px;padding:14px 6px 12px;display:grid;justify-items:center;gap:6px;color:inherit;text-align:center}
.g:hover{border-color:var(--line)}
.g svg{width:46px;height:46px}
.g .n{font-family:var(--f-display);font-size:23.5px;line-height:1}
.g .e{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--glow-faint)}
.lead{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.lead svg{width:64px;height:64px}

/* archive */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border-top:1px solid var(--line);padding-top:8px}
.stat .v{font-family:var(--f-display);font-size:34.5px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--glow-faint);margin-top:4px}
.search{width:100%;border-radius:999px;border:1px solid rgba(244,241,230,.16);background:rgba(22,19,42,.6);padding:10px 16px;font-family:var(--f-ui);font-size:17px}
.entries{display:grid;gap:10px}
.entry{display:grid;grid-template-columns:34px 1fr;gap:12px;text-align:left;width:100%;border:0;border-bottom:1px solid rgba(244,241,230,.08);background:none;padding:10px 0;color:inherit}
.entry svg{width:34px;height:34px}
.entry .t{font-family:var(--f-display);font-size:23.5px;line-height:1.15}
.entry .m{font-family:var(--f-ui);font-size:15.5px;color:var(--glow-faint);margin-top:2px}
.entry .x{font-size:19px;color:var(--glow-dim);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:16px}
.empty h3{margin-bottom:6px}
.tag{display:inline-block;font-family:var(--f-ui);font-size:15.5px;border-radius:999px;padding:3px 10px;background:rgba(244,241,230,.07);color:var(--glow-dim)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(22,19,42,0),rgba(22,19,42,.96) 30%)}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(33,28,59,.92);border:1px solid var(--line);border-radius:22px;padding:6px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav.tabs button{border:0;background:none;border-radius:16px;padding:7px 0 6px;display:grid;justify-items:center;gap:2px;color:var(--glow-faint);font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--glow);background:rgba(231,196,90,.1)}
nav.tabs button[aria-selected="true"] svg{color:var(--gold)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(8,6,18,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--night-2);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:44px;height:4px;border-radius:4px;background:rgba(244,241,230,.2);margin:4px auto 12px}
.sheet{position:relative}
.sheet .x{position:absolute;top:12px;right:14px;z-index:2;border:0;background:rgba(244,241,230,.08);width:34px;height:34px;border-radius:50%;font-family:var(--f-ui);font-size:22.5px;line-height:1;color:var(--glow)}
.sheet .stack{display:grid;gap:16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--glow-faint)}
.field input[type=text]{border-radius:12px;border:1px solid rgba(231,196,90,.35);background:rgba(22,19,42,.7);padding:11px 14px;font-size:20.5px}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-ui);font-size:18px;padding:8px 0;border-bottom:1px solid rgba(244,241,230,.08)}
.switch input{width:22px;height:22px;accent-color:var(--fuchsia)}

/* ritual mode */
.rite{position:fixed;inset:0;z-index:30;background:var(--parch);color:var(--ink);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.rite::before{content:"";position:absolute;inset:10px;border:1px solid rgba(154,116,20,.55);box-shadow:inset 0 0 0 4px var(--parch),inset 0 0 0 5px rgba(154,116,20,.35);pointer-events:none;border-radius:4px}
.rite .wrap{position:relative;flex:1;overflow:auto;max-width:560px;width:100%;margin:0 auto;padding:26px 30px 20px;display:flex;flex-direction:column;gap:16px}
.rite .bar{display:flex;align-items:center;gap:10px}
.rite .bar svg{width:32px;height:32px}
.rite .bar .t{flex:1;min-width:0;font-family:var(--f-ui);font-size:15.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.rite .close{border:0;background:rgba(42,33,48,.08);width:36px;height:36px;border-radius:50%;font-family:var(--f-ui);font-size:22.5px}
.rite .count{font-family:var(--f-sc);font-size:18.5px;color:var(--ink-soft)}
.rite h2{color:var(--ink);font-size:41.5px}
.rite .text{font-size:23px;line-height:1.5}
.rite .say{font-family:var(--f-display);font-style:italic;font-size:28.5px;line-height:1.3;color:#6E1142;padding:14px 0;border-top:1px solid rgba(154,116,20,.4);border-bottom:1px solid rgba(154,116,20,.4);text-align:center;text-wrap:balance}
.rite .secret{font-size:19.5px;color:var(--ink-soft);font-style:italic}
.rite .timer{display:flex;align-items:center;gap:12px;font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.rite .timer .clock{font-size:29.5px;font-weight:700;min-width:70px}
.rite .foot{position:relative;max-width:560px;width:100%;margin:0 auto;padding:12px 30px 22px;display:flex;gap:10px}
.rite .foot .btn{flex:1}
.rite .btn-ghost{color:var(--ink);box-shadow:inset 0 0 0 1px rgba(42,33,48,.35)}
.rite input[type=text]{background:rgba(255,255,255,.5);border:1px solid rgba(154,116,20,.5);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:20.5px}
.rite input[type=text]::placeholder{color:#8a7a86}
.rite .field label{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase}
.rite textarea{background:rgba(255,255,255,.5);border-color:rgba(154,116,20,.5);color:var(--ink)}
.rite textarea::placeholder{color:#8a7a86}
.rite .chip{color:var(--ink);border-color:rgba(42,33,48,.25);background:rgba(255,255,255,.35)}
.rite .chip[aria-pressed="true"]{background:#6E1142;color:#FFF3F8;border-color:#6E1142}
.pips{display:flex;gap:6px}
.pips i{height:3px;flex:1;border-radius:3px;background:rgba(42,33,48,.15)}
.pips i.on{background:#9A7414}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;top:calc(14px + env(safe-area-inset-top,0px));text-align:center;z-index:60;line-height:1.35;z-index:40;background:var(--glow);color:var(--ink);font-family:var(--f-ui);font-size:17px;padding:10px 16px;border-radius:16px;box-shadow:0 10px 24px -10px rgba(0,0,0,.6);max-width:440px}
/* circle strip on Today */
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.av{flex:none;width:74px;border:0;background:none;padding:0;display:grid;justify-items:center;gap:4px;color:var(--glow)}
.av .frame{width:66px;height:80px;border-radius:33px 33px 12px 12px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(44,38,80,.95),rgba(22,19,42,.95));box-shadow:inset 0 0 0 1px var(--c),0 8px 18px -10px var(--c)}
.av .frame svg{width:50px;height:50px}
.av .n{font-family:var(--f-display);font-size:18.5px;line-height:1}
/* talk */
.talk{position:fixed;inset:0;z-index:30;background:var(--night);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.talk .hd{max-width:480px;width:100%;margin:0 auto;display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.talk .hd svg{width:44px;height:44px;flex:none}
.talk .hd .who{flex:1;min-width:0}
.talk .hd .who .n{font-family:var(--f-display);font-size:26.5px;line-height:1}
.talk .hd .who .t{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase}
.iconbtn{border:0;background:rgba(244,241,230,.08);min-width:38px;height:38px;border-radius:19px;padding:0 12px;font-family:var(--f-ui);font-size:16px;color:var(--glow)}
.talk .msgs{flex:1;overflow:auto;max-width:480px;width:100%;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.intro{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(44,38,80,.9),rgba(33,28,59,.9));padding:16px;display:grid;gap:10px}
.intro .top2{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.intro .top2 svg{width:64px;height:64px}
.intro .kv{font-family:var(--f-ui);font-size:16.5px;line-height:1.5;color:var(--glow-dim)}
.intro .kv b{color:var(--glow);font-weight:700}
.bub{max-width:86%;padding:10px 14px;border-radius:16px;font-size:20.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:rgba(191,30,115,.26);border:1px solid rgba(224,67,143,.45);border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--night-2);border:1px solid var(--line);border-bottom-left-radius:4px;font-family:var(--f-display);font-size:23.5px;line-height:1.38}
.bub .btn{margin-top:10px;font-size:17px;padding:10px 14px}
.talk .ft{max-width:480px;width:100%;margin:0 auto;padding:10px 16px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end;border-top:1px solid rgba(244,241,230,.08)}
.talk textarea{min-height:48px;max-height:140px}
.talk .hint{grid-column:1/-1;font-family:var(--f-ui);font-size:15.5px;color:var(--glow-dim)}
.mic,.send{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;flex:none}
.mic{background:rgba(231,196,90,.14);box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.mic svg,.send svg{width:22px;height:22px}
.mic.on{background:var(--fuchsia);color:#fff;box-shadow:0 0 0 6px rgba(191,30,115,.25)}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:ring 1.3s ease-out infinite}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(224,67,143,.6)}100%{box-shadow:0 0 0 14px rgba(224,67,143,0)}}
.send{background:radial-gradient(120% 140% at 30% 0%,var(--fuchsia-hi),var(--fuchsia) 55%,#8E1054);color:#fff}
.composer{position:relative}
.composer textarea{padding-right:56px}
.composer .mic{position:absolute;right:6px;bottom:8px;width:42px;height:42px}
.composer .mic svg{width:20px;height:20px}
.talk .ft{display:flex;gap:8px;align-items:flex-end}
.talk .ft .composer{flex:1;min-width:0}
.talk .ft textarea{border-radius:24px;padding:12px 56px 12px 16px;resize:none}
.talk .ft .composer .mic{bottom:3px;right:3px}
.ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-family:var(--f-ui);font-size:17px;color:var(--ink);position:relative}
.ask .chip,.dh .chip{color:var(--ink);border-color:rgba(42,33,48,.3);background:rgba(255,255,255,.4)}
.dh{margin-top:10px;display:grid;gap:8px;position:relative;color:var(--ink-soft)}
.linkish.dark{color:#6E1142;align-self:center;font-family:var(--f-ui);font-size:17px}
.page .actions{align-items:center;flex-wrap:wrap}
.quiet{border:1px solid rgba(244,241,230,.1);border-radius:16px;padding:14px 16px;background:rgba(33,28,59,.5)}
.quiet summary{cursor:pointer;list-style:none;display:grid;gap:4px}
.quiet summary::-webkit-details-marker{display:none}
.quiet .qt{font-family:var(--f-display);font-size:23.5px;line-height:1.25}
.ledg{margin-top:12px}
.ledg .lk{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--glow-faint)}
.ledg .li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:6px 0;border-bottom:1px solid rgba(244,241,230,.06);font-size:19.5px}
.x2{border:0;background:none;color:var(--glow-faint);font-size:22.5px;line-height:1;padding:0 4px}
.danger{box-shadow:inset 0 0 0 1px rgba(240,112,63,.6)!important;color:#F4A58A!important}
.btn-main.danger{background:#8E2A12;color:#fff!important}
.pill{margin-left:auto;border:1px solid rgba(244,241,230,.2);background:rgba(22,19,42,.5);color:var(--glow-dim);border-radius:999px;padding:5px 11px;font-family:var(--f-ui);font-size:15.5px}
.pill:hover{color:var(--glow);border-color:var(--gold)}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(244,241,230,.06);font-size:19.5px}
.checkin{border-color:rgba(231,196,90,.4)}
.ask.dark{color:var(--glow)}
.ask.dark .chip{color:var(--glow-dim);border-color:rgba(244,241,230,.2);background:rgba(244,241,230,.04)}
.plan{margin:10px 0 12px;padding-left:20px;display:grid;gap:8px}
.close.voice.on{background:#6E1142;color:#fff}
.simple{position:fixed;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.simple .breath{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(231,196,90,.55),rgba(231,196,90,.08) 70%);box-shadow:0 0 60px rgba(231,196,90,.35)}

@keyframes breathe{0%,100%{transform:scale(.6)}40%{transform:scale(1.25)}50%{transform:scale(1.25)}}
.simple .s1{font-family:var(--f-display);font-size:34.5px;line-height:1.15}
.simple .s2{font-size:23.5px;color:var(--glow-dim);max-width:30ch}
.simple .s3{font-family:var(--f-display);font-style:italic;font-size:23px;color:var(--gold)}
.group{border-top:1px solid rgba(244,241,230,.1);padding-top:10px}
.group summary{cursor:pointer;list-style:none;font-family:var(--f-display);font-size:23px;display:flex;justify-content:space-between}

.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.addrow input{flex:1 1 140px;min-width:0;border-radius:12px;border:1px solid rgba(231,196,90,.35);background:rgba(22,19,42,.7);padding:10px 12px;font-size:19.5px;color:var(--glow)}
.x2.in{font-size:18.5px;padding:0 0 0 4px;color:var(--glow-dim)}
span.chip{display:inline-flex;align-items:center}
.altarsvg{width:100%;height:auto;margin-top:8px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.ba blockquote{margin:4px 0 0;font-family:var(--f-display);font-style:italic;font-size:20.5px;line-height:1.35}
.eyes{position:fixed;inset:0;z-index:70;background:#000;color:#6c6480;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-size:25.5px;text-align:center;padding:24px}
.yearbook p b{font-family:var(--f-ui);font-weight:700;font-size:16px;letter-spacing:.06em}
.chip.calm{border-color:rgba(231,196,90,.5);color:var(--gold)}
.badge.gold{background:rgba(231,196,90,.16);color:var(--gold);border-color:rgba(231,196,90,.5);margin-left:6px;vertical-align:middle}
.icircle{border-color:rgba(224,67,143,.45);background:linear-gradient(180deg,rgba(60,24,70,.85),rgba(33,28,59,.85))}
.icircle.open{border-color:rgba(231,196,90,.5)}
.chgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.chc{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;text-align:left;border:1px solid rgba(244,241,230,.1);background:rgba(22,19,42,.5);border-radius:12px;padding:8px;color:inherit}

.cl{font-family:var(--f-ui);font-size:15.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.li.jl{width:100%;border:0;background:none;text-align:left;color:inherit}
.promise{font-family:var(--f-display);font-style:italic;font-size:19.5px;color:var(--glow-dim);text-align:center;margin-top:12px}
.handoff{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:16px 18px 4px}
.handoff svg{width:30px;height:30px}
.handoff p{font-family:var(--f-display);font-style:italic;font-size:22.5px;line-height:1.35;color:var(--glow-dim)}
.handoff .who2{display:block;font-family:var(--f-ui);font-style:normal;font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.recall{border:1px solid rgba(231,196,90,.35);border-radius:14px;padding:12px 14px;background:rgba(22,19,42,.5)}
.recall blockquote{margin:6px 0 0;font-family:var(--f-display);font-style:italic;font-size:23.5px;line-height:1.35}
.whynow{margin-top:12px;border-top:1px solid rgba(154,116,20,.35);padding-top:10px;position:relative}
.whynow summary{cursor:pointer;font-family:var(--f-ui);font-size:15.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6E1142;list-style:none}
.whynow summary::-webkit-details-marker{display:none}


.whytalk{margin-top:8px;font-size:20px;line-height:1.55;color:var(--ink)}
.whysign{margin-top:8px;font-family:var(--f-display);font-style:italic;font-size:22.5px;color:#6E1142}
.whysign span{font-family:var(--f-ui);font-style:normal;font-size:15.5px;letter-spacing:.08em;color:var(--ink-soft)}

.whynow dt{font-family:var(--f-ui);font-size:15.5px;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.whynow dd{margin:0;font-size:19px;line-height:1.45;color:var(--ink-soft)}

.badge{display:inline-block;font-family:var(--f-ui);font-size:15.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:rgba(191,30,115,.2);color:#F7B3D3;border:1px solid rgba(224,67,143,.45)}
.page.locked{background:linear-gradient(180deg,#E9DFC6,#DCCDA8)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.chip{padding:9px 15px}
.feelhint{margin-top:10px}
@media (min-width:760px){html{zoom:1.35}}
@media (min-width:1300px) and (min-height:900px){html{zoom:1.5}}
.letterc{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;border-color:rgba(231,196,90,.45);background:linear-gradient(135deg,rgba(191,30,115,.16),rgba(33,28,59,.9))}

{id:"tidewater-rest",g:"fern",title:"Tidewater Rest",el:"Water",moon:"Any",min:12,

 steps:[
  {t:"Warm water",d:"Fill a bowl with warm water. Rest both hands in it."},

{id:"four-count",g:"lily",title:"Four-Count Clearing",el:"Air",moon:"Any",min:5,

 needs:[],

  {t:"Open a window",d:"Open a window or step outside. Fresh air in."},

{id:"salt-line",g:"thistle",title:"The Salt Line",el:"Earth",moon:"Waning",min:7,

 needs:[["salt","Salt"]],
 steps:[
  {t:"Stand at the door",d:"Go to your front door or the door of your room."},
  {t:"Name it",d:"Say out loud who or what is no longer allowed in. Be specific. This does not make you mean."},
  {t:"Draw the line",d:"Pour a thin line of salt along the threshold or windowsill. No salt? Trace the line with a wet finger."},

{id:"mirror-honey",g:"marigold",title:"Mirror Honey",el:"Light",moon:"Waxing",min:6,
 purpose:"Speak to yourself the way you speak to the people you love.",
 needs:[["mirror","A mirror"],["honey","A little honey or sugar"]],

  {t:"Good light",d:"Stand at a mirror in the best light in your home."},

  {t:"Wear the gold",d:"Put on one thing that makes you feel like gold. Earrings, lipstick, the good robe."}],

{id:"threshold-reset",g:"juniper",title:"Threshold Reset",el:"Wood",moon:"Any",min:15,

{id:"jar-returning",g:"rue",title:"Jar of Returning",el:"Warding",moon:"Waning",min:10,

 needs:[["jar","A small jar with a lid"],["salt","Salt"],["pepper","Black pepper"]],

  {t:"Fold away",d:"Fold it away from you twice."},
  {t:"Layer",d:"Salt first, then the paper, then pepper, then rosemary if you have it."},
  {t:"Seal and shake",d:"Close it tight and shake it hard.",say:"Block. Cut. Banish. Not in my house."},
  {t:"Place it",d:"Keep it by the front door or in a dark cupboard. Try me."}],

{id:"ledger",g:"sol",title:"The Ledger of Intention",el:"Metal",moon:"New",min:10,
 purpose:"Turn a wish into three moves.",
 needs:[],
 steps:[
  {t:"Three intentions",d:"Write three intentions for this cycle. Plain words."},
  {t:"One move each",d:"Under each, write one action you could do in fifteen minutes."},
  {t:"Put it in the plan",d:"Put all three actions on your calendar right now. Dates and times."},
  {t:"Sign it",d:"Sign and date the page.",say:"Discipline is devotion."},
  {t:"Carry it",d:"Fold it and keep it with your keys or wallet until the next new moon."}],

{id:"seed-intention",g:"sol",title:"New Moon Seed",el:"Earth",moon:"New",min:10,

 needs:[["soil","A seed or dried bean and a cup of soil or damp paper towel"]],
 steps:[
  {t:"Hold the seed",d:"Hold a seed or a dried bean in your palm. Warm it."},
  {t:"Speak into it",d:"Say your intention into your closed hand, once, clearly."},
  {t:"Plant",d:"Press it into a cup of soil, or fold it into a damp paper towel in a jar."},
  {t:"Seal the promise",d:"Water it.",say:"I plant it. I tend it. I trust the dark to do its work."},

{id:"full-moon-release",g:"fern",title:"Full Moon Release Bowl",el:"Water",moon:"Full",min:15,

 needs:[["bowl","A bowl of water"]],
 steps:[
  {t:"Write what is leaving",d:"On paper, write what is ready to leave you. A habit, a fear, a person's hold."},
  {t:"Moonlight",d:"Set a bowl of water where the moon can reach it, or at a window."},

{id:"gilded-shower",g:"marigold",title:"The Gilded Shower",el:"Light",moon:"Any",min:20,bath:true,
 purpose:"Luxury as medicine.",
 needs:[["oil","Body oil, lotion or anything that smells like a treat"]],
 steps:[
  {t:"Set the scene",d:"Dim the lights. Something that smells good. The good towel, not the old one."},
  {t:"Wash it off",d:"In the water, name what you're washing off today, part by part.",
   alt:{noBath:"Use a warm washcloth at the sink. Neck, wrists, face, feet."},hold:300},
  {t:"Anoint",d:"Oil or lotion, slowly, on purpose, like you're worth the time.",say:"You're allowed."},
  {t:"Get dressed for you",d:"Put on something that makes you feel like the main character. Nobody has to see it."}],
 secret:"Pleasure is a frequency. You are tuning to it on purpose.",

  {t:"Name where you are",d:"Say it out loud: the day, where you are, and what you're carrying. No fixing, just naming."},
  {t:"Touch an element",d:"Touch one element. Water from the tap. Light from a window. A plant. The floor.",hold:30},
  {t:"Speak",d:"Breathe once, slowly.",say:"I am here. I can do the next small thing."},
  {t:"Choose",d:"Choose the next small thing. Do only that."}],

  {t:"One word",d:"Say one word for how you want today to feel. Only one."},

  {t:"Night: write the question",d:"Before bed, write one question you need clarity on. Fold it and put it under your pillow."},

  {t:"Morning: don't move yet",d:"When you wake, stay still. Don't reach for anything.",hold:60},

 steps:[
  {t:"Arms up",d:"Stand. Arms straight up, like you just won. Hold it.",hold:30},
  {t:"Three reasons",d:"Out loud, three reasons you are going to be great at this. Loud. Louder than feels normal."},
  {t:"Shake it out",d:"Shake your hands, your shoulders, your whole body for twenty seconds.",hold:20},
  {t:"Go",d:"Point at the door.",say:"Let it shine. I didn't come here to play small."}],

{id:"solar-charge",g:"sol",member:true,title:"Solar Plexus Charge",el:"Sun",moon:"Full",min:8,

 steps:[
  {t:"Find the sun spot",d:"Place your palm just above your belly button, below your ribs. That's your power center."},

  {t:"Speak",d:"Press gently.",say:"Energy. Intention. Action. This is mine."}],

{id:"victory-jar",g:"sol",member:true,title:"The Victory Jar",el:"Sun",moon:"Any",min:10,

 steps:[
  {t:"Name the jar",d:"Write VICTORIES on a label or paper and put it on the jar."},
  {t:"First five",d:"On small slips, write five things you did this year that you're proud of. Big or small."},
  {t:"Drop them in",d:"Read each one out loud as you drop it in.",say:"That was me. I did that."},
  {t:"Keep feeding it",d:"Put it where you'll see it. Every win this month gets a slip."}],

/* EMBER · Courage */
{id:"courage-coal",g:"ember",title:"The Courage Coal",el:"Fire",moon:"First Quarter",min:7,
 purpose:"For the moment before the hard conversation or the big leap.",needs:[["candle","A candle, or any warm light"]],
 steps:[
  {t:"Light it",d:"Light a candle, or turn on the warmest lamp you have. Sit close."},
  {t:"Name the fear",d:"Say out loud exactly what you're afraid will happen."},
  {t:"Name the cost",d:"Now say what it costs you if you don't do it. Be honest."},
  {t:"Take the coal",d:"Cup your hands near the light, then close them around the warmth.",say:"I carry the fire. I go anyway."},
  {t:"Act within the hour",d:"Do the first piece of the scary thing within the hour. Send the text. Make the call."}],
 secret:"Courage is not the absence of fear. It's fear with a deadline.",
 prompts:["What were you afraid of?","What did you do within the hour?"],
 tags:["scared","afraid","fear","courage","leap","quit","confront","hard conversation"]},
{id:"last-straw",g:"ember",member:true,title:"The Last Straw Ceremony",el:"Fire",moon:"Waning",min:12,
 purpose:"Officially end something you have tolerated too long.",needs:[["thread","A piece of string or thread"]],
 steps:[
  {t:"Tie the knot",d:"Tie a knot in a piece of string for each time you said 'this is the last time' and it wasn't."},
  {t:"Hold the count",d:"Look at how many knots there are. Let yourself feel it."},
  {t:"Cut it",d:"Cut the string right through the middle with scissors.",say:"That was the last straw. This is the last time, and I mean it."},
  {t:"Throw it out",d:"Throw both halves in the outside trash, not the one in your home."},
  {t:"One changed behavior",d:"Write down the one thing you will do differently next time it happens."}],
 secret:"Knots hold repeated promises. Cutting them makes the ending physical.",
 prompts:["What are you done tolerating?","What will you do next time?"],
 tags:["done","enough","fed up","quit","end","toxic","leave"]},
{id:"phoenix-shower",g:"ember",member:true,title:"The Phoenix Shower",el:"Fire and Water",moon:"New",min:12,bath:true,
 purpose:"Burn off the old version of you and step out new.",needs:[["salt","A handful of salt"]],
 steps:[
  {t:"Hot first",d:"Start the shower as hot as is comfortable. Scrub your arms and legs with a little salt.",hold:120},
  {t:"Name the old self",d:"Say out loud who you were that you are done being."},
  {t:"Cool rinse",d:"Turn it cooler for the last thirty seconds.",hold:30,say:"I rise out of what I was."},
  {t:"New clothes",d:"Put on something clean you haven't worn in a while, like it belongs to the new you."}],
 secret:"Heat opens, cold seals. You are closing the door on the old self with your skin.",
 prompts:["Who were you done being?","Who stepped out?"],
 tags:["reinvent","change","new me","rebirth","breakup","transformation"]},

/* WILLOW · Grief */
{id:"grief-bowl",g:"willow",title:"The Willow Water Bowl",el:"Water",moon:"Waning",min:10,
 purpose:"Give grief somewhere to go.",needs:[["bowl","A bowl of water"]],
 steps:[
  {t:"Fill the bowl",d:"Fill a bowl with water. Set it in front of you."},
  {t:"Speak to what you lost",d:"Say their name, or the name of what ended. Then say what you miss. Take your time.",hold:120},
  {t:"Let it fall",d:"If tears come, let them. If not, drip water from your fingers into the bowl, one drop for each thing you miss."},
  {t:"Hold it",d:"Hold the bowl in both hands.",say:"You can be soft here. Love doesn't leave. It changes shape."},
  {t:"Give it to the earth",d:"Pour it into soil or a plant. Grief feeds something."}],
 secret:"Willows grow best near water. So does grief that is allowed to move.",
 prompts:["What do you miss most?","What would they want you to know?"],
 tags:["grief","grieving","loss","died","death","miss","mourning","sad","dog","cat","pet"]},
{id:"forgiveness-knot",g:"willow",member:true,title:"The Forgiveness Knot",el:"Water",moon:"Waning Crescent",min:10,
 purpose:"Loosen a grudge that is hurting you more than them.",needs:[["thread","A piece of thread or string"]],
 steps:[
  {t:"Tie it tight",d:"Tie a tight knot in the thread. Name who or what it holds."},
  {t:"Tell the truth first",d:"Say what they did and how it hurt. Forgiveness never skips this part."},
  {t:"Loosen, don't cut",d:"Slowly work the knot loose with your fingers. Take as long as it takes."},
  {t:"Speak",d:"Hold the loose thread.",say:"I'm not saying it was okay. I'm saying I'm done carrying it."},
  {t:"Keep or bury",d:"Keep the thread as a reminder, or bury it."}],
 secret:"Forgiveness is untying, not erasing. The thread remembers, it just stops pulling.",
 prompts:["Who is the knot for?","What part still pulls?"],
 tags:["forgive","grudge","resent","hurt","betrayed","family","mother","father"]},
{id:"empty-chair",g:"willow",member:true,title:"The Empty Chair",el:"Water",moon:"Any",min:20,
 purpose:"Say what you never got to say.",needs:[],
 steps:[
  {t:"Set the chair",d:"Place an empty chair across from you. Picture them sitting in it."},
  {t:"Talk",d:"Say everything. The thank you, the apology, the anger, the goodbye.",hold:300},
  {t:"Switch seats",d:"Sit in their chair. Answer as they would have, if they were at their best."},
  {t:"Return",d:"Go back to your chair.",say:"It's said now. I can put it down."},
  {t:"Move the chair back",d:"Put the chair back where it belongs."}],
 secret:"Unfinished words stay loud. Finished ones go quiet.",
 prompts:["What did you finally say?","What did they say back?"],
 tags:["grief","closure","never said","goodbye","died","regret"]},

{id:"green-nap",g:"juniper",title:"The Green Nap",el:"Forest",moon:"Any",min:20,
 purpose:"Rest like the forest floor.",needs:[],
 steps:[

  {t:"Heavy limbs",d:"Let each limb get heavy, one at a time. Feet, legs, hands, arms, face."},
  {t:"Speak once",d:"Very quietly.",say:"Slow is sacred. Nothing needs me for twenty minutes."},

 tags:["tired","exhausted","rest","sleep","nap","burnout","slow"]},
{id:"stone-stillness",g:"juniper",member:true,title:"Stone Stillness",el:"Forest",moon:"Waning",min:10,

 steps:[

{id:"slow-tea",g:"juniper",member:true,title:"Slow Tea",el:"Forest",moon:"Any",min:12,
 purpose:"Turn a cup of tea into a full stop.",needs:[["tea","Tea, or hot water with lemon"]],
 steps:[
  {t:"Make it slowly",d:"Make tea like it's the only thing you're doing today. Watch the water."},
  {t:"Hands around it",d:"Hold the cup in both hands before you drink. Feel the heat.",hold:30},
  {t:"Drink without a screen",d:"Drink the whole cup with nothing in front of you but the view.",hold:300},
  {t:"Last sip",d:"On the last sip.",say:"I grow quietly."}],

 prompts:["What did you notice that you usually miss?"],
 tags:["busy","overwhelmed","rest","calm","slow"]},

{id:"sign-log",g:"wren",title:"The Sign Log",el:"Air",moon:"Any",min:5,

function known(){return S.profile.known||(S.profile.known=[...S.profile.have]);}
function missingFor(r){return (r.needs||[]).filter(n=>SUBS[n[0]]&&known().includes(n[0])&&!S.profile.have.includes(n[0]));}
function unknownFor(r){return (r.needs||[]).filter(n=>SUBS[n[0]]&&!known().includes(n[0])&&!S.profile.have.includes(n[0]));}
function adapt(r){
  const miss=missingFor(r).map(n=>n[0]); if(!miss.length)return {...r,notes:[]};
  const notes=miss.map(t=>"No "+NOUN[t].replace(/^an? /,"")+"? Use "+subFor(t)+".");
  const steps=r.steps.map(s=>{
    let d=s.d;const lo=d.toLowerCase();
    for(const t of miss)if((KEYS[t]||[]).some(k=>lo.includes(k))&&!lo.includes("no "+NOUN[t].replace(/^an? /,"")))d+=" (No "+NOUN[t].replace(/^an? /,"")+"? Use "+subFor(t)+" instead.)";
    return {...s,d};
  });
  return {...r,steps,notes};
}
function setOwned(tag,yes){
  const p=S.profile;known();
  if(!p.known.includes(tag))p.known.push(tag);
  if(yes){if(!p.have.includes(tag))p.have.push(tag);}else p.have=p.have.filter(x=>x!==tag);
  persist("profile");
}

function resetProgress(){
  const rs=S.entries.filter(e=>e.resetDay).sort((a,b)=>a.ts-b.ts);

const STOP=new Set("that this with have from they them what when were been just like really feel feeling about into your mine then than there their would could should because again still even today tonight here very much some more most over only also dont didnt cant wont keep keeps being make made know want need thing things something".split(" "));
function words(t){return [...new Set(String(t||"").toLowerCase().replace(/[^a-z\s']/g," ").split(/\s+/).filter(w=>w.length>3&&!STOP.has(w)).map(w=>w.replace(/(ing|ed|es|s)$/,"")))];}
function similarEntry(text){
  const a=words(text); if(a.length<2)return null;
  let best=null,bs=0;
  for(const e of S.entries){
    if(e.private||Date.now()-e.ts<20*3600e3)continue;
    const b=words((e.carrying||"")+" "+(e.text||"")); if(!b.length)continue;
    const shared=a.filter(w=>b.includes(w)).length;
    const sc=shared/Math.sqrt(a.length*b.length);
    if(shared>=2&&sc>bs){bs=sc;best=e;}
  }
  return bs>=0.22?best:null;
}
function habit(){
  const c={};for(const e of S.entries)if(e.theme&&e.theme!=="reset")c[e.theme]=(c[e.theme]||0)+1;
  const top=Object.entries(c).sort((x,y)=>y[1]-x[1])[0];
  return top&&top[1]>=3?{theme:top[0],count:top[1],total:S.entries.length}:null;
}

/* Fast local routing for the special cases, before the ritual picker */
function localRoute(text){
  const t=text.toLowerCase();
  if(/can'?t think|cannot think|too much|shutting down|freaking out|panic attack|can'?t breathe/.test(t))return {action:"simplify",guardian:"aura",reading:"Stop. You don't have to figure anything out right now.",aura:"I've got you. Just one thing."};
  if(/^(when did i|what have i|show me|how (many|often)|have i ever|what did i (say|write))/.test(t))return {action:"answer",guardian:"aura",...archiveSearch(text)};
  if(/\b(should i|deciding|decide|whether (to|or)|can'?t decide|torn between)\b/.test(t))return {action:"decide",guardian:"aura",reading:"Let's not decide yet. Let's separate what you want from what you're afraid of and what you think you owe.",aura:"This is a decision. I won't make it for you, but I'll help you hear yourself."};
  const ev=lifeEventFor(text);
  if(ev)return {action:"event",guardian:ev.g,plan:{title:ev.title,steps:ev.steps.map(([id,note])=>({ritualId:id,title:byId[id]?byId[id].title:"",note}))},reading:"This is a transition, and transitions need more than one ritual. I made you a path.",aura:"This is bigger than one night. That's "+G[ev.g].name+"'s work."};
  if(/\b(create|make|write|build|design) (me )?(a |my own )?ritual\b|ritual for my\b/.test(t))return {action:"build",guardian:"aura"};
  return null;
}
function archiveSearch(text){
  const ws=words(text).filter(w=>!["when","first","start","talk","written","write","said","show","time","times","ever"].includes(w));
  const hits=S.entries.filter(usable).filter(e=>{const b=((e.carrying||"")+" "+(e.text||"")+" "+(e.ritualTitle||"")+" "+(e.thread||"")).toLowerCase();return ws.some(w=>b.includes(w));}).sort((a,b)=>a.ts-b.ts);
  if(!hits.length)return {answer:"I looked through everything you've written and couldn't find that yet.",cites:[]};
  const first=hits[0],last=hits[hits.length-1];
  return {answer:"You've written about this "+hits.length+" time"+(hits.length>1?"s":"")+". The first was "+fmtDate(first.ts)+(hits.length>1?", the most recent "+fmtDate(last.ts):"")+".",cites:hits.slice(-6).reverse().map(e=>e.id)};
}
async function askArchive(question){
  const local=archiveSearch(question);
  try{
    const list=S.entries.filter(usable).slice(0,200).map(e=>"- id "+e.id+" | "+fmtDate(e.ts)+" | "+(e.thread||e.theme||"")+" | "+(e.ritualTitle||"")+" | carrying: "+(e.carrying||"").slice(0,120)+" | wrote: "+(e.text||"").slice(0,200)).join("\n");
    const out=await aiJSON("You answer questions about a person's private ritual journal, gently and precisely. Answer only from the entries below. If they don't hold the answer, say so. Quote her words briefly when useful. No em dashes.\n\nENTRIES:\n"+list+"\n\nQUESTION: "+question+'\n\nReply with ONLY JSON: {"answer":"2 to 4 sentences","citeIds":["ids of the entries you used, up to 6"]}',null);
    const cites=(out.citeIds||[]).filter(id=>S.entries.some(e=>e.id===id));
    return {answer:clean(out.answer||local.answer),cites:cites.length?cites:local.cites};
  }catch(e){return local;}
}

/* Bring this back later */
function laterDue(opt){
  const d=new Date();
  if(opt==="tonight"){d.setHours(20,0,0,0);if(d<new Date())d.setDate(d.getDate()+1);return d.getTime();}
  if(opt==="tomorrow"){d.setDate(d.getDate()+1);d.setHours(9,0,0,0);return d.getTime();}
  if(opt==="week"){d.setDate(d.getDate()+7);d.setHours(9,0,0,0);return d.getTime();}
  if(opt==="newmoon")return Date.now()+Math.max(1,M.toNew)*864e5;
  if(opt==="fullmoon")return Date.now()+Math.max(1,M.toFull)*864e5;
  return Date.now()+864e5;
}

function musicSrc(g){const u=window.DA_CONFIG&&window.DA_CONFIG.supabaseUrl;return u?u.replace(/\/$/,"")+"/storage/v1/object/public/music/"+g+".mp3":null;}
function fadeTo(el,v,ms,done){if(!el)return;clearInterval(el._fade);const from=el.volume,t0=Date.now();el._fade=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/ms);try{el.volume=Math.max(0,Math.min(1,from+(v-from)*k));}catch(e){}if(k>=1){clearInterval(el._fade);done&&done();}},50);}

  MUSIC.want=g||MUSIC.base;

  if(MUSIC.cur&&MUSIC.cur._g===MUSIC.want){fadeTo(MUSIC.cur,musicVol(),600);if(MUSIC.cur.paused)MUSIC.cur.play().catch(()=>{});return;}
  const src=musicSrc(MUSIC.want);if(!src)return;
  const old=MUSIC.cur,el=new Audio();el._g=MUSIC.want;el.loop=true;el.preload="auto";el.volume=0;el.src=src;
  el.onerror=()=>{if(MUSIC.cur===el)MUSIC.cur=null;if(el._g!=="aura"&&MUSIC.want===el._g){MUSIC.want="aura";musicPlay("aura");}};
  MUSIC.cur=el;el.play().then(()=>fadeTo(el,musicVol(),1800)).catch(()=>{});
  if(old)fadeTo(old,0,1500,()=>{try{old.pause();}catch(e){}});
}
function musicStop(){const el=MUSIC.cur;MUSIC.cur=null;if(el)fadeTo(el,0,800,()=>{try{el.pause();}catch(e){}});}

function lastTouch(){
  const t={};

  return t;

function nudgeCandidate(){
  if(!isMember())return null;
  const now=Date.now();
  if(S.nudges.some(n=>now-n.ts<20*36e5))return null;
  const t=lastTouch();let best=null;
  for(const [k,v] of Object.entries(t)){
    const age=now-v.ts;if(age<1.5*864e5||age>6*864e5)continue;
    if(S.nudges.some(n=>n.g===k&&n.ts>v.ts))continue;
    if(safetyKind((v.e&&(v.e.carrying+" "+v.e.text))||v.said))continue;
    if(!best||v.ts>best.ts)best={g:k,...v};
  }
  return best;
}

const NO_MIC=new Set(["siEmail","siPhone","siCode","delConfirm","email","code"]);
let micSeq=0;
function addMics(root){
  (root||document).querySelectorAll('textarea, input[type="text"], input[type="search"], input:not([type])').forEach(el=>{
    if(el.dataset.mic==="done"||NO_MIC.has(el.id)||el.closest(".composer,.micwrap")||el.type==="hidden")return;
    const im=(el.getAttribute("inputmode")||"").toLowerCase(),ac=(el.getAttribute("autocomplete")||"").toLowerCase();
    if(im==="email"||im==="numeric"||ac==="one-time-code"||ac==="email")return;

    el.dataset.mic="done";

async function toggleNativeMic(btn,SRn){
  const on=b=>{b.classList.toggle("on",!!on.v);b.setAttribute("aria-pressed",String(!!on.v));};
  if(nRec){try{await SRn.stop();}catch(e){}try{nRec.l1&&nRec.l1.remove();nRec.l2&&nRec.l2.remove();}catch(e){}on.v=false;on(nRec.btn);nRec=null;return;}
  const ta=document.getElementById(btn.dataset.mic);if(!ta)return;

    const pm=await SRn.requestPermissions();if(pm&&pm.speechRecognition&&pm.speechRecognition!=="granted"){toast("Allow the microphone for The Daily Alchemist in your phone's settings, then try again.");return;}
    const base=ta.value.trim()?ta.value.trim()+" ":"";

    nRec.l1=await SRn.addListener("partialResults",d=>{const t=d&&d.matches&&d.matches[0];if(t){ta.value=base+t;ta.dispatchEvent(new Event("input",{bubbles:true}));}});

    on.v=true;on(btn);

function toggleMic(btn){
  const SRn=nativeSR();if(SRn){toggleNativeMic(btn,SRn);return;}
  if(rec){stopMic();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micBlocked();return;}
  const ta=document.getElementById(btn.dataset.mic);if(!ta)return;
  const base=ta.value.trim()?ta.value.trim()+" ":"";
  rec=new SR();rec.lang=navigator.language||"en-US";rec.interimResults=true;rec.continuous=true;recBtn=btn;
