<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16132A">
<meta name="description" content="The Daily Alchemist remembers what you're living through, recognizes your patterns and brings you the right ritual, reflection or guide when you need it. Small rituals, kept daily, become who you are.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Alchemist">

<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta property="og:title" content="The Daily Alchemist">
<meta property="og:description" content="The Daily Alchemist remembers what you're living through, recognizes your patterns and brings you the right ritual, reflection or guide when you need it. Small rituals, kept daily, become who you are.">
<meta property="og:image" content="/icons/icon-512.png">
<style>html,body{height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<title>The Daily Alchemist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="/styles.css?v=3b4f696ae2">

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="eyebrow"><span class="badge gold" id="memBadge" hidden>Inner Circle</span></div>
      <h1 class="foil shine">The Daily Alchemist</h1>
    </div>
    <div class="topctl">
    <button class="setbtn" id="altarBtn" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div class="sndbar"></div>
    </div>
  </header>

  <div class="sky" id="sky"></div>

  <section class="view" id="v-today"></section>
  <section class="view" id="v-journeys" hidden></section>
  <section class="view" id="v-circle" hidden></section>
  <section class="view" id="v-archive" hidden></section>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in" role="tablist">
    <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M5.2 18.8l2.1-2.1M16.7 7.3l2.1-2.1"/></svg>Today</button>
    <button role="tab" data-tab="journeys" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 20c3-1 4-5 8-6s5-5 8-8"/><circle cx="4" cy="20" r="1.4"/><circle cx="12" cy="14" r="1.4"/><circle cx="20" cy="6" r="1.4"/></svg>Journeys</button>
    <button role="tab" data-tab="circle" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5l2.4 6.1 6.1.4-4.7 4 1.5 6.3L12 17l-5.3 3.3 1.5-6.3-4.7-4 6.1-.4z"/></svg>Circle</button>
    <button role="tab" data-tab="archive" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 4.5h11.5a2.5 2.5 0 0 1 2.5 2.5v12.5H7.5A2.5 2.5 0 0 1 5 17z"/><path d="M5 17a2.5 2.5 0 0 1 2.5-2.5H19M9 8h6"/></svg>Archive</button>
  </div>
</nav>

<div id="layer"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script src="/app.js?v=b263292ee9"></script>

<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));</script>
</body>
</html>
